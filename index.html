<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Generator</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .rounded-pill {
      border-radius: 50rem !important;
    }
    .header-row th {
      text-align: center;
      vertical-align: middle;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container py-5">
    <!-- input and button  -->
    <div class="row mb-4 justify-content-center">
      <div class="col-md-4 mb-2">
        <input type="number" id="userCount" class="form-control rounded-pill text-center" placeholder="Enter number of users (0-1000)">
      </div>
      <div class="col-md-2 mb-2">
        <button id="generateBtn" class="btn btn-primary w-100 rounded-pill">Generate</button>
      </div>
    </div>

    <!-- table -->
    <div class="table-responsive">
      <table class="table align-middle text-center">
        <thead>
        <tr class="header-row">
            <th>
            <select id="nameType" class="form-select rounded-pill text-center">
                <option value="first">First Name</option>
                <option value="last">Last Name</option>
            </select>
            </th>
            <th><span class="badge bg-light text-dark rounded-pill p-3 fs-5">Gender</span></th>
            <th><span class="badge bg-light text-dark rounded-pill p-3 fs-5">Email Address</span></th>
            <th><span class="badge bg-light text-dark rounded-pill p-3 fs-5">Country</span></th>
        </tr>
        </thead>

        <tbody id="userTable"></tbody>
      </table>
    </div>
  </div>

  <div class = "modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">User Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="text-center mb-3">
            <img id="modalUserImg" class="rounded-circle" width="100" height="100" alt="User photo">
            <h4 id="modalUserName"></h4>
          </div>
          <p><strong>Address:</strong> <span id="modalUserAddress"></span></p>
          <p><strong>Email:</strong> <span id="modalUserEmail"></span></p>
          <p><strong>Phone:</strong> <span id="modalUserPhone"></span></p>
          <p><strong>DOB:</strong> <span id="modalUserDob"></span></p>
          <p><strong>Gender:</strong> <span id="modalUserGender"></span></p>
        </div>
        <div class="modal-footer">
          <button id="deleteUserBtn" class="btn btn-danger">Delete</button>
          <button id="editUserBtn" class="btn btn-warning">Edit</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
